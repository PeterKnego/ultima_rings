name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  test-arm:
    # Weak-memory hardware lane: same tests on aarch64, where a missing or
    # too-weak ordering shows up that x86's stronger model hides. `sharded`
    # composes `spsc`'s Release/Acquire edges, so this is the lane most
    # likely to catch a problem with it.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: cargo test

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: RUSTFLAGS="--cfg loom" cargo test --test loom --release

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --component miri
      - run: cargo +nightly miri test

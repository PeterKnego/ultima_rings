[package]
name = "ultima_rings"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Peter Knego <peter@knego.net>"]
description = "Bounded lock-free SPSC/MPSC rings with pluggable wait strategies"
repository = "https://github.com/pknego/ultima_rings"

[dependencies]

[dev-dependencies]
criterion = "0.5"
crossbeam-channel = "0.5"
flume = "0.11"
kanal = "0.1"
rtrb = "0.3"

[features]
# Experimental sharded MPSC prototype (N x SPSC + round-robin consumer).
# Default off: not part of the stable API, BusySpin-only, no loom models.
experimental-sharded = []

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "throughput"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

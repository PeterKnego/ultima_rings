[package]
name = "ultima_rings"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Peter Knego <peter@knego.net>"]
description = "Bounded lock-free SPSC/MPSC rings with selectable wait strategies"
repository = "https://github.com/PeterKnego/ultima_rings"

[dependencies]

[dev-dependencies]
core_affinity = "0.8.3"
criterion = "0.5"
crossbeam-channel = "0.5"
disruptor = "4.4"
flume = "0.11"
kanal = "0.1"
rtrb = "0.3"
thingbuf = "0.1.6"

[features]
# Experimental sharded MPSC prototype (N x SPSC + round-robin consumer).
# Default off: not part of the stable API, BusySpin-only.
experimental-sharded = []

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "throughput"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
